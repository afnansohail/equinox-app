name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Query Supabase (resets the 7-day inactivity clock)
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/stocks?select=symbol&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o /dev/null

      - name: Record run (resets GitHub's own 60-day scheduled-workflow clock)
        run: |
          mkdir -p .github/keepalive
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive/last-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive/last-run.txt
          git diff --staged --quiet || git commit -m "chore: keep-alive ping $(date -u +%F)"
          git push
